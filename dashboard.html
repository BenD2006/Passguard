<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Management System</title>
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <!-- Link to the external stylesheet -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- Edit Password Modal -->
    <div id="editpasswordmodal" class="editmodal">
        <form class="modal-content">
            <h2>Edit Password</h2>
            <div style="display: flex; flex-direction: column; gap: 15px;">
                <div>
                    <label for="editwebpage">Website Name:</label>
                    <input type="text" id="editwebpage" name="editwebpage">
                </div>
                <div>
                    <label for="editusername">Username/Email:</label>
                    <input type="text" id="editusername" name="editusername">
                </div>
                <div>
                    <label for="editpassword">Password:</label>
                    <input type="password" id="editpassword" name="editpassword">
                </div>
                <button onclick="editPassword()" type="button">Submit Changes</button>
                <button onclick="document.getElementById('editpasswordmodal').style.display = 'none'" type="button">Close</button>
            </div>
        </form>
    </div>

    <!-- Search Results Modal -->
    <div id="searchResultsModal" class="searchResultsModal">
        <div class="modal-content">
            <h2>Search Results</h2>
            <div id="searchResults"></div>
            <button onclick="closeSearchResults()" type="button">Close</button>
        </div>
    </div>

    <!-- Settings Modal -->
    <div id="settingsWindow" class="settingsModal">
        <div class="modal-content">
            <h2>Settings</h2>
            <h3>Background Colour</h3>
            <div style="display: flex; flex-wrap: wrap; gap: 10px; justify-content: center;">
                <button onclick="changeBGColour('blue')">Blue</button>
                <button onclick="changeBGColour('red')">Red</button>
                <button onclick="changeBGColour('green')">Green</button>
                <button onclick="changeBGColour('white')">White</button>
                <button onclick="changeBGColour('#d0e0ff')">Default</button>
            </div>
            <button onclick="document.getElementById('settingsWindow').style.display = 'none'" type="button" style="margin-top: 20px;">Close</button>
        </div>
    </div>

    <!-- Main Content -->
    <div id="mainContainer">
        <h1 class="mainPageTitle">PassGuard</h1> 
        
        <div id="menuRight">
            <button type="button" onclick="logout()">Log Out</button>
            <button type="button" onclick="clearStorage()">Clear Storage</button>
            <button type="button" onclick="document.getElementById('settingsWindow').style.display = 'flex'">Settings</button>
        </div>

        <div id="searchContainer">
            <input type="text" id="passwordSearch" placeholder="Search passwords by website or username...">
            <button onclick="searchPassword()">Search</button>
        </div>
        
        <!-- NEW: Wrapper for the left column grid -->
        <div id="left-column">
            <div id="savePasswordArea">
                <h3>Save New Password</h3>
                <form onsubmit="event.preventDefault(); savePassword();"> 
                    <div>
                        <label for="webpage">Webpage Name:</label>
                        <input type="text" id="webpage" name="webpage" value="">
                    </div>
                    <div>
                        <label for="username">Username/Email:</label>
                        <input type="text" id="username" name="username" value="">
                    </div>
                    <div>
                        <label for="password">Password:</label>
                        <input type="password" id="password" name="password" value="">
                    </div>
                    <button type="submit">Submit</button>
                </form>
            </div>
            
            <div id="deletePasswordArea">
                <h3>Delete Password</h3>
                <form onsubmit="event.preventDefault(); deletePassword();">
                    <div>
                        <label for="deletewebpage">Webpage Name:</label>
                        <input type="text" id="deletewebpage" name="deletewebpage" value="">
                    </div>
                    <button type="submit">Delete</button>
                </form>
            </div>

            <div id="checkPasswordArea">
                <h3>Password Strength Checker</h3>
                <label for="passwordCheck">Enter Password to Check:</label>
                <input type="text" id="passwordCheck" placeholder="Type your password here" oninput="checkPasswordStrength()" />
                <label>Strength:</label>
                <div class="power-container">
                    <div id="power-point"></div>
                </div>
            </div>

            <div id="generatePasswordArea">
                <h3>Password Generator</h3>
                <div>
                    <label for="numofchar">Characters (8-100):</label>
                    <input type="number" id="numofchar" value="12" min="8" max="100">
                </div>
                <div style="display: flex; flex-direction: column; gap: 5px; margin-top: 10px;">
                    <label><input type="checkbox" id="lchar" checked> Lowercase</label>
                    <label><input type="checkbox" id="uchar" checked> Uppercase</label>
                    <label><input type="checkbox" id="num" checked> Numbers</label>
                    <label><input type="checkbox" id="sym" checked> Symbols</label>
                </div>
                <button onclick="generatePassword()">Generate</button>
                <p id="passwordgen" style="display:none; margin-top: 15px; font-weight: bold; text-align: center; word-break: break-all;"></p>
            </div>
        </div>

        <div id="showPasswordArea">
            <h3>Stored Passwords</h3>
            <p>Click on a row to edit a password.</p>
            <button onclick="togglePasswordVisibility()">Toggle Passwords Visibility</button>
            <div style="overflow-x: auto;">
                <table id="passwordTable">
                    <thead>
                        <tr>
                            <th>Website</th>
                            <th>Username/Email</th>
                            <th>Password</th>
                        </tr>
                    </thead>
                    <tbody id="passwordTableBody">
                        <!-- Password entries will be dynamically populated here -->
                    </tbody>
                </table>
            </div>                
        </div>
    </div>

    <!-- Link to the external JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
